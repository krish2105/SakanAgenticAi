# Render Blueprint for Sakan AI's backend.
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
#
# Postgres is NOT provisioned by this blueprint on purpose: Render allows
# only one free-tier Postgres per account, and that slot may already be used
# by another project. Use a free external Postgres instead (Neon or
# Supabase both have genuinely free tiers) and paste its connection string
# into DATABASE_URL below -- see the README's deploy walkthrough.
#
# Qdrant is also external for the same free-tier reasoning: Render's free
# tier has no Private Services (needed for a non-public vector DB), and a
# public Docker-image web service for Qdrant has port-binding quirks that
# couldn't be verified from the sandbox this was built in. Use Qdrant
# Cloud's free tier (cloud.qdrant.io) instead.
#
# All env vars below are marked sync: false, so Render prompts you to fill
# them in on the sakan-backend service page rather than needing values
# committed here:
#   DATABASE_URL       - your Neon/Supabase Postgres connection string
#   QDRANT_URL         - your Qdrant Cloud cluster URL
#   QDRANT_API_KEY     - your Qdrant Cloud API key
#   JWT_SECRET_KEY     - REQUIRED, not optional -- a long random string (e.g.
#                        `openssl rand -hex 32`). Without it the app falls
#                        back to a hardcoded dev-only secret and every
#                        issued login token is forgeable by anyone who reads
#                        this repo's source.
#   CORS_ORIGINS       - your Vercel frontend URL, e.g.
#                        https://sakan-agentic-ai.vercel.app (comma-separate
#                        multiple origins if needed)
#   ANTHROPIC_API_KEY  - optional; every agent has a deterministic fallback.
#                        Wins over GEMINI_API_KEY if both are set.
#   GEMINI_API_KEY     - optional, free tier; Google AI Studio
#                        (aistudio.google.com/apikey, no card) gives real LLM
#                        reasoning at zero cost if ANTHROPIC_API_KEY is unset.
#                        See app/llm.py.
#   REDIS_URL          - optional; unset means the WS pub/sub AND the
#                        market/comps response cache (app/cache.py) both fall
#                        back to in-memory, which is fine for a single Render
#                        instance (the free plan's default) but stops
#                        fanning out correctly the moment you scale beyond
#                        one. A free Upstash Redis instance (console.upstash.com,
#                        256MB/500K commands/month, no card) is the usual
#                        pairing if you need it before then.
#   EMAIL_PROVIDER     - optional; defaults to "console" (logs the reset/
#                        verify link instead of emailing it -- fine for a
#                        demo, useless for real users). Set to "resend" +
#                        RESEND_API_KEY for a free real option (3,000
#                        emails/month, no card -- resend.com/signup).
#   RESEND_API_KEY,
#   EMAIL_FROM         - required if EMAIL_PROVIDER=resend/smtp; see README
#                        "Auth" for the SMTP alternative env vars.
#   STRIPE_SECRET_KEY,
#   STRIPE_WEBHOOK_SECRET,
#   STRIPE_PRICE_ID_PRO,
#   STRIPE_PRICE_ID_TEAM - optional; unset means /billing/plans and /billing/me
#                        still work (quota enforcement needs no Stripe), but
#                        /billing/checkout and /billing/portal return a clear
#                        501 instead of crashing. See README "Billing".
#   FRONTEND_URL       - your Vercel frontend URL; used for Stripe Checkout's
#                        success/cancel redirect targets. Defaults to
#                        http://localhost:3000, which is wrong for production.
#   WHATSAPP_VERIFY_TOKEN,
#   WHATSAPP_APP_SECRET,
#   WHATSAPP_ACCESS_TOKEN,
#   WHATSAPP_PHONE_NUMBER_ID - optional; unset means /whatsapp/webhook's GET
#                        handshake always 403s and its POST handler accepts
#                        unverified payloads (dev-only fallback -- set
#                        WHATSAPP_APP_SECRET before pointing a real Meta
#                        webhook at this). See README "WhatsApp".
#   DATA_SOURCE,
#   LICENSED_DATA_FEED_URL,
#   LICENSED_DATA_FEED_API_KEY - optional; DATA_SOURCE defaults to
#                        "synthetic". No licensed data partnership exists
#                        yet, so LicensedFeedDataSource raises a clear
#                        error if selected without a real feed configured.
#                        See README "Data partnership".
#
# Note: written and reasoned through carefully, but never actually deployed
# from this session -- the sandbox it was built in has no network path to
# render.com to verify it end-to-end. Double-check current Render Blueprint
# syntax against Render's docs before relying on it.

services:
  - type: web
    name: sakan-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      # Fail-closed mode: refuse to boot with a missing JWT secret or an
      # enabled-but-unverified Stripe/WhatsApp webhook (see backend/app/config.py).
      - key: SAKAN_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_PRO
        sync: false
      - key: STRIPE_PRICE_ID_TEAM
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: DATA_SOURCE
        sync: false
      - key: LICENSED_DATA_FEED_URL
        sync: false
      - key: LICENSED_DATA_FEED_API_KEY
        sync: false
