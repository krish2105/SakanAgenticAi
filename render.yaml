# Render Blueprint for Sakan AI's backend + Postgres.
# Deploy: Render dashboard -> New -> Blueprint -> point at this repo.
#
# Qdrant is NOT self-hosted here on purpose: Render's free tier doesn't
# support Private Services (needed for a non-public vector DB), and running
# it as a public "web" service has port-binding quirks with third-party
# Docker images that couldn't be verified from the sandbox this was built
# in. Use Qdrant Cloud's free tier instead (cloud.qdrant.io) and point
# QDRANT_URL/QDRANT_API_KEY at it -- see the README's deploy walkthrough.
#
# After the blueprint deploys, set these on the sakan-backend service
# (all marked sync: false, so Render prompts for them rather than needing
# values committed here):
#   ANTHROPIC_API_KEY  - optional; every agent has a deterministic fallback
#   QDRANT_URL         - your Qdrant Cloud cluster URL
#   QDRANT_API_KEY     - your Qdrant Cloud API key
#
# Note: written and reasoned through carefully, but never actually deployed
# from this session -- the sandbox it was built in has no network path to
# render.com to verify it end-to-end. Double-check current Render Blueprint
# syntax against Render's docs before relying on it.

services:
  - type: web
    name: sakan-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sakan-postgres
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

databases:
  - name: sakan-postgres
    plan: free
    databaseName: sakan
    user: sakan
