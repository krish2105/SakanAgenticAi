# Alembic config for Sakan AI.
# The database URL is NOT set here -- migrations/env.py reads it from the app's
# own config (DATABASE_URL, with the same postgres:// normalization the app
# uses) so there's a single source of truth. Run from the backend/ directory:
#   alembic upgrade head
#   alembic revision -m "add x"     (hand-written)
# Deploys use scripts/run_migrations.py, which handles adopting a pre-Alembic DB.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
