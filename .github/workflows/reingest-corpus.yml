name: Re-ingest regulatory corpus

# Runs backend/scripts/ingest_regulations.py on a schedule so the compliance
# corpus in Qdrant has "a scheduled re-ingestion job... instead of a
# one-time ingest" (MVP roadmap, Phase B). upsert_chunks() writes points at
# a fixed id per clause (see ingest_regulations.py), so re-running this against
# an unchanged regulations/ directory is a no-op overwrite, not a duplicate --
# safe to run on a schedule and safe to re-run manually.
#
# This workflow does NOT give the corpus "a named owner for keeping it
# current as RERA rules change" (the other half of that roadmap line) --
# that's a people/process commitment, not something a workflow file can
# satisfy on its own. It keeps whatever's already in regulations/ synced to
# Qdrant; someone still has to actually update regulations/*.md when rules
# change.

on:
  schedule:
    - cron: "5 4 * * 1" # weekly, Monday
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Parse and chunk only, skip the Qdrant upsert"
        type: boolean
        default: false

jobs:
  reingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Re-ingest regulations/*.md into Qdrant
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/ingest_regulations.py --regulations-dir ../regulations --dry-run
          elif [ -z "$QDRANT_URL" ]; then
            echo "::warning::QDRANT_URL secret is not set -- skipping. Add it (and QDRANT_API_KEY, if using Qdrant Cloud) in repo Settings > Secrets and variables > Actions to enable scheduled re-ingestion."
          else
            python scripts/ingest_regulations.py --regulations-dir ../regulations
          fi
